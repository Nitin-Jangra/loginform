<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HRMS Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FIX: Load Supabase JS library (dashboard.js needs it) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- FIX: Lucide must load BEFORE dashboard.js uses it -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- If you keep your Supabase credentials in a separate config file,
     include it here (it must be loaded BEFORE dashboard.js):
<script src="supabase-config.js"></script>
-->

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            HR<span>i</span>MS
        </div>

        <nav>

            <a class="active">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a>
                <i data-lucide="users"></i>
                <span>Employees</span>
            </a>

            <a>
                <i data-lucide="calendar-days"></i>
                <span>Attendance</span>
            </a>

            <a>
                <i data-lucide="calendar-range"></i>
                <span>Leave</span>
            </a>

            <a>
                <i data-lucide="wallet"></i>
                <span>Payroll</span>
            </a>

            <a>
                <i data-lucide="folder"></i>
                <span>Documents</span>
            </a>

            <a>
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <!-- FIX: header moved INSIDE .main-content (was outside the grid, breaking layout) -->

        <header class="top-header">

            <div class="search-box">

                <i data-lucide="search"></i>

                <input
                    type="text"
                    placeholder="Search employees, modules..."
                >

                <span class="shortcut">Ctrl + /</span>

            </div>

            <div class="header-right">

                <button class="icon-btn">

                    <i data-lucide="bell"></i>

                    <span class="badge">3</span>

                </button>

                <button class="icon-btn">

                    <i data-lucide="message-square"></i>

                    <span class="badge">1</span>

                </button>

                <div class="user-profile">

                    <div class="user-avatar" id="topAvatar">
                        NJ
                    </div>

                    <div class="user-info">

                        <h4 id="topUserName">Loading...</h4>

                        <p id="topUserRole">Employee</p>

                    </div>

                    <i data-lucide="chevron-down"></i>

                </div>

            </div>

        </header>

        <!-- FIX: only ONE placeholder kept (duplicate removed) -->

        <div class="page-placeholder">

            <h1>Dashboard</h1>

            <p>Next we'll build the greeting section.</p>

        </div>

    </main>

</div>

<!-- FIX: single entry point. dashboard.js now calls lucide.createIcons()
     (duplicate inline script removed) -->
<script src="dashboard.js"></script>

</body>
</html>
