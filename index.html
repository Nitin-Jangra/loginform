<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Login Form -->
    <div id="login-form" class="form-container active">
        <h2>Log In</h2>
        <form>
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
            <button type="button" id="loginBtn">Log In</button>
        </form>
        <div class="switch-text">
            Don't have an account? <a onclick="toggleForms()">Create new account</a>
        </div>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="form-container">
        <h2>Create Account</h2>
        <form>
            <div class="input-group">
                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" required placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required placeholder="Enter your password">
            </div>
            <button type="button" id="signupBtn">Sign Up</button>
        </form>
        <div class="switch-text">
            Already have an account? <a onclick="toggleForms()">Log In</a>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
